services:
  psp-streamer:
    build: .
    ports:
      - "${PSP_STREAMER_PORT:-8091}:8091"
    environment:
      MEDIA_ROOTS: /media
      MAX_TRANSCODES: "4"
      PSP_STREAMER_ACCELERATION: "${PSP_STREAMER_ACCELERATION:-software}"
      PSP_STREAMER_VAAPI_DEVICE: "${PSP_STREAMER_VAAPI_DEVICE:-/dev/dri/renderD128}"
      PSP_STREAMER_PASSWORD: "${PSP_STREAMER_PASSWORD:-}"
      PSP_STREAMER_SETTINGS_DIR: /data
      PSP_STREAMER_TLS_CERT: "${PSP_STREAMER_TLS_CERT:-}"
      PSP_STREAMER_TLS_KEY: "${PSP_STREAMER_TLS_KEY:-}"
    volumes:
      - streamer-settings:/data
      # SMB mount on the host; exposed read-only inside the container.
      - ${MEDIA_ROOT_PATH:-/media}:/media:ro
    restart: unless-stopped

volumes:
  streamer-settings:
