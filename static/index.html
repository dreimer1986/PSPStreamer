<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSP Streamer</title>
<link rel="stylesheet" href="/style.css">
<main>
  <h1>PSP Streamer</h1>
  <p id="location">Mediathek wird geladen …</p>
  <nav id="roots"></nav>
  <section id="library"></section>
  <section id="player" hidden>
    <h2 id="title"></h2>
    <label>Audiospur <select id="audio"></select></label>
    <label>Subtitles <select id="subtitle"></select></label>
    <button id="start">Start transcoding</button>
    <video id="video" controls playsinline></video>
    <p class="hint">The browser player is for checking the source and transcoding. Optimized H.264/MP3 playback happens in the PSP app.</p>
  </section>
</main>
<script src="/app.js"></script>
</html>
