<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSP Streamer Remote</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#091018;color:#e8f5ff}body{max-width:980px;margin:0 auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #20c8ff;padding-bottom:10px}h1{font-size:1.25rem;margin:0;color:#20c8ff}.grid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}button,select{background:#152330;color:#e8f5ff;border:1px solid #35546c;border-radius:6px;padding:9px;margin:3px;cursor:pointer}button:hover{border-color:#20c8ff}.item{display:block;width:100%;text-align:left}.folder{color:#8de3ff}.selected{border-color:#ffc34d;background:#293142}#crumb{color:#9ab1c3;margin:8px 0}.panel{background:#101b25;border:1px solid #284354;border-radius:8px;padding:12px}.muted{color:#91a7b7;font-size:.9rem}.controls{display:flex;flex-wrap:wrap}label{display:block;margin:10px 0}#status{color:#8de3ff;min-height:1.4em}</style>
<header><h1>PSP STREAMER // REMOTE</h1><span id="health">connecting…</span></header>
<div class="grid"><main class="panel"><div id="crumb">/</div><div id="library"></div></main><aside class="panel"><b id="title">Select a video</b><p class="muted" id="details">Browse the library, then send it to the PSP.</p><label>Audio <select id="audio"></select></label><label>Subtitles <select id="subtitle"><option value="-1">Off</option></select></label><label>Seek <input id="seek" type="range" min="0" max="0" value="0"><span id="seekLabel">0:00</span></label><div class="controls"><button id="play">Play on PSP</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="stop">Stop</button></div><p id="status"></p></aside></div>
<details class="panel"><summary>Server settings</summary>
<p id="passwordInfo">Loading settings…</p>
<form id="passwordForm" hidden>
<label>Current password <input id="oldPassword" type="password" autocomplete="current-password"></label>
<label>New password <input id="newPassword" type="password" autocomplete="new-password" required></label>
<label>Repeat password <input id="repeatPassword" type="password" autocomplete="new-password" required></label>
<button type="submit">Save password</button>
<p class="muted">Also update the password on the PSP. Set the initial password on a trusted network before exposing the server. HTTP does not encrypt passwords.</p>
</form></details>
<script>
let root=0,path='',selected=null,remotePlaying=false;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function option(select,n,label){let o=document.createElement('option');o.value=n;o.textContent=label;select.append(o)}
// Keep browser preferences separate from the PSP's locally saved defaults.
for(const [id,title,values] of [
  ['audio_quality','Audio quality',[['160k','CBR 160 kbit/s'],['128k','CBR 128 kbit/s'],['96k','CBR 96 kbit/s'],['v6','VBR V6 — smaller'],['v5','VBR V5 — balanced'],['v4','VBR V4 — higher quality'],['v3','VBR V3 — higher quality']]],
  ['video_fps','Frame rate',[['20','20 fps — compatibility'],['24000/1001','23.976 fps — film/anime']]]
]) {
  const label=document.createElement('label'), select=document.createElement('select');
  label.textContent=title+' '; select.id=id;
  for(const [value,text] of values) option(select,value,text);
  try { const saved=localStorage.getItem(id); if(values.some(v=>v[0]===saved)) select.value=saved; } catch(e) {}
  select.onchange=()=>{try{localStorage.setItem(id,select.value)}catch(e){}};
  label.append(select); $('#seek').parentElement.before(label);
}
async function browse(next=''){path=next;let d=await api(`/api/library?root=${root}&path=${encodeURIComponent(path)}`);$('#crumb').textContent='/'+(d.path||'');let box=$('#library');box.innerHTML='';if(d.parent!==null){let b=document.createElement('button');b.textContent='← Parent';b.className='item folder';b.onclick=()=>browse(d.parent);box.append(b)}for(let f of d.folders){let b=document.createElement('button');b.textContent='▸ '+f.name;b.className='item folder';b.onclick=()=>browse(f.path);box.append(b)}for(let v of d.videos){let b=document.createElement('button');b.textContent=(v.kind==='audio'?'♫ ':'▶ ')+v.name;b.className='item';b.onclick=()=>choose(v,b);box.append(b)}}
async function choose(v,button){selected=v;$('#video_fps').parentElement.hidden=v.kind==='audio';$('#audio').parentElement.style.display=v.kind==='audio'?'none':'';$('#subtitle').parentElement.style.display=v.kind==='audio'?'none':'';document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');$('#title').textContent=v.name;$('#details').textContent='Loading tracks…';let d=await api('/api/metadata/'+encodeURIComponent(v.id));if(selected!==v)return;let a=$('#audio'),s=$('#subtitle');a.innerHTML='';s.innerHTML='<option value="-1">Off</option>';(d.a||[]).forEach(x=>option(a,x.n,`${x.l||'und'} ${x.t||''}`));(d.s||[]).forEach(x=>option(s,x.n,`${x.l||'und'} ${x.t||''}`));$('#seek').max=Math.floor(+d.d||0);$('#seek').value=0;$('#seekLabel').textContent='0:00';$('#details').textContent=v.kind==='audio'?'Music stream':'Ready to send to the PSP'}
async function command(action,extra={}){if(action==='play'&&!selected)return;let body={action,...extra};if(action==='play')Object.assign(body,{id:selected.id,audio_quality:$('#audio_quality').value,video_fps:$('#video_fps').value,audio:selected.kind==='audio'?0:(+$('#audio').value||0),subtitle:selected.kind==='audio'?-1:($('#subtitle').value===''?-1:+$('#subtitle').value),start:+$('#seek').value||0});await api('/api/remote/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#status').textContent='Sent: '+action}
$('#play').onclick=()=>command('play').then(()=>remotePlaying=true).catch(e=>$('#status').textContent=e.message);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>command(b.dataset.action).then(()=>{if(b.dataset.action==='stop')remotePlaying=false}).catch(e=>$('#status').textContent=e.message));$('#seek').oninput=e=>{$('#seekLabel').textContent=Math.floor(e.target.value/60)+':'+String(e.target.value%60).padStart(2,'0')};$('#seek').onchange=e=>{if(remotePlaying)command('seek',{seconds:+e.target.value}).catch(x=>$('#status').textContent=x.message)};
api('/api/health').then(x=>{$('#health').textContent=`online · ${x.roots} roots`;browse()}).catch(e=>$('#health').textContent=e.message);
api('/api/settings').then(s=>{
  $('#passwordForm').hidden=!s.password_editable;
  $('#oldPassword').required=s.password_set;
  $('#passwordInfo').textContent=s.password_editable?(s.password_set?'Password enabled.':'No password set — server is currently open.'):'Password is managed in Home Assistant / the server environment.';
}).catch(e=>$('#passwordInfo').textContent=e.message);
$('#passwordForm').onsubmit=async e=>{
  e.preventDefault();
  const password=$('#newPassword').value;
  if(password!==$('#repeatPassword').value){$('#passwordInfo').textContent='Passwords do not match.';return}
  try {
    await api('/api/settings/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:$('#oldPassword').value,password})});
    $('#passwordForm').reset();
    $('#oldPassword').required=true;
    $('#passwordInfo').textContent='Saved. Sign in again as psp with the new password; update the PSP too.';
  } catch(error){$('#passwordInfo').textContent=error.message}
};
</script>
</html>
