# Requires NVIDIA host driver + NVIDIA Container Toolkit configured for Docker.
services:
  psp-streamer:
    environment:
      PSP_STREAMER_ACCELERATION: "${PSP_STREAMER_ACCELERATION:-nvenc}"
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
