name: PSP Streamer
slug: psp_streamer
version: "0.1.54"
description: Transcodes a Home Assistant media library for PSP Streamer.
url: https://github.com/dreimer1986/PSPStreamer
# The reference add-on runs on this Home Assistant installation's amd64 host.
# The base image is intentionally explicit; legacy build.yaml is ignored.
arch: [amd64]
startup: services
boot: auto
init: false
# SSDP multicast discovery needs the host network. The configured port is bound
# directly; users can still enter a description URL for other routed networks.
host_network: true
map:
  - type: ssl
    read_only: true
    path: /ssl
  - type: media
    read_only: true
    path: /media
options: {port: 8091, max_transcodes: 4, password: "", tls_cert: "", tls_key: ""}
schema: {port: port, max_transcodes: "int(2,8)", password: password, tls_cert: str, tls_key: str}
