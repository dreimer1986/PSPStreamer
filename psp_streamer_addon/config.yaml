name: PSP Streamer
slug: psp_streamer
version: "0.1.13"
description: Transcodes a Home Assistant media library for PSP Streamer.
url: https://github.com/dreimer1986/PSPStreamer
# The reference add-on runs on this Home Assistant installation's amd64 host.
# The base image is intentionally explicit; legacy build.yaml is ignored.
arch: [amd64]
startup: services
boot: auto
init: false
ports: {8091/tcp: 8091}
ports_description: {8091/tcp: PSP Streamer HTTP server}
map:
  - type: media
    read_only: true
    path: /media
options: {port: 8091, max_transcodes: 4}
schema: {port: port, max_transcodes: "int(2,8)"}
