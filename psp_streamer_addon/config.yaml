name: PSP Streamer
slug: psp_streamer
version: "0.1.2"
description: Transcodes a Home Assistant media library for PSP Streamer.
url: https://github.com/dreimer1986/PSPStreamer
# Das Referenz-Add-on läuft auf dieser Home-Assistant-Installation auf amd64.
# Die Basis wird absichtlich fest angegeben (kein inzwischen ignoriertes build.yaml).
arch: [amd64]
startup: services
boot: auto
init: false
ports: {8091/tcp: 8091}
ports_description: {8091/tcp: PSP Streamer HTTP server}
map:
  - type: media
    read_only: true
    path: /media
options: {port: 8091, max_transcodes: 4}
schema: {port: port, max_transcodes: "int(2,8)"}
