<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSP Streamer Remote</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#091018;color:#e8f5ff}body{max-width:980px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;border-bottom:2px solid #20c8ff;padding-bottom:10px}h1{font-size:1.25rem;margin:0;color:#20c8ff}.grid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}button,select{background:#152330;color:#e8f5ff;border:1px solid #35546c;border-radius:6px;padding:9px;margin:3px;cursor:pointer}button:hover{border-color:#20c8ff}.item{display:block;width:100%;text-align:left}.folder{color:#8de3ff}.selected{border-color:#ffc34d;background:#293142}#crumb{color:#9ab1c3;margin:8px 0}.panel{background:#101b25;border:1px solid #284354;border-radius:8px;padding:12px}.muted{color:#91a7b7;font-size:.9rem}.controls{display:flex;flex-wrap:wrap}label{display:block;margin:10px 0}#status{color:#8de3ff;min-height:1.4em}</style>
<header><h1>PSP STREAMER // REMOTE</h1><span id="health">connecting…</span></header><div class="grid"><main class="panel"><div id="crumb">/</div><div id="library"></div></main><aside class="panel"><b id="title">Select a video</b><p class="muted" id="details">Browse the library, then send it to the PSP.</p><label>Audio <select id="audio"></select></label><label>Subtitles <select id="subtitle"><option value="-1">Off</option></select></label><div class="controls"><button id="play">Play on PSP</button></div><p id="status"></p></aside></div>
<script>let root=0,path='',selected=null;const $=s=>document.querySelector(s);async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}function option(s,n,l){let o=document.createElement('option');o.value=n;o.textContent=l;s.append(o)}async function browse(p=''){path=p;let d=await api(`/api/library?root=${root}&path=${encodeURIComponent(path)}`);$('#crumb').textContent='/'+(d.path||'');let b=$('#library');b.innerHTML='';if(d.parent!==null){let x=document.createElement('button');x.textContent='← Parent';x.className='item folder';x.onclick=()=>browse(d.parent);b.append(x)}for(let f of d.folders){let x=document.createElement('button');x.textContent='▸ '+f.name;x.className='item folder';x.onclick=()=>browse(f.path);b.append(x)}for(let v of d.videos){let x=document.createElement('button');x.textContent=(v.kind==='audio'?'♫ ':'▶ ')+v.name;x.className='item';x.onclick=()=>choose(v,x);b.append(x)}}async function choose(v,b){selected=v;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#title').textContent=v.name;let d=await api('/api/metadata/'+encodeURIComponent(v.id)),a=$('#audio'),s=$('#subtitle');a.innerHTML='';s.innerHTML='<option value="-1">Off</option>';(d.a||[]).forEach(x=>option(a,x.n,`${x.l||'und'} ${x.t||''}`));(d.s||[]).forEach(x=>option(s,x.n,`${x.l||'und'} ${x.t||''}`));$('#details').textContent='Ready to send to the PSP'}async function command(action){if(action==='play'&&!selected)return;let body={action};if(action==='play')Object.assign(body,{id:selected.id,audio:+$('#audio').value||0,subtitle:+$('#subtitle').value||-1});await api('/api/remote/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#status').textContent='Sent: '+action}$('#play').onclick=()=>command('play').catch(e=>$('#status').textContent=e.message);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>command(b.dataset.action).catch(e=>$('#status').textContent=e.message));api('/api/health').then(x=>{$('#health').textContent=`online · ${x.roots} roots`;browse()}).catch(e=>$('#health').textContent=e.message);</script>
</html>
