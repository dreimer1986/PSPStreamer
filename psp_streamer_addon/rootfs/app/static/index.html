<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSP Streamer Remote</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#091018;color:#e8f5ff}body{max-width:980px;margin:0 auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #20c8ff;padding-bottom:10px}h1{font-size:1.25rem;margin:0;color:#20c8ff}.grid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}button,select{background:#152330;color:#e8f5ff;border:1px solid #35546c;border-radius:6px;padding:9px;margin:3px;cursor:pointer}button:hover{border-color:#20c8ff}.item{display:block;width:100%;text-align:left}.folder{color:#8de3ff}.selected{border-color:#ffc34d;background:#293142}#crumb{color:#9ab1c3;margin:8px 0}.panel{background:#101b25;border:1px solid #284354;border-radius:8px;padding:12px}.muted{color:#91a7b7;font-size:.9rem}.controls{display:flex;flex-wrap:wrap}label{display:block;margin:10px 0}#status{color:#8de3ff;min-height:1.4em}</style>
<header><h1>PSP STREAMER // REMOTE</h1><span id="health">connecting…</span></header>
<div class="grid"><main class="panel"><div id="crumb">/</div><div id="library"></div></main><aside class="panel"><b id="title">Select a video</b><p class="muted" id="details">Browse the library, then send it to the PSP.</p><label>Audio <select id="audio"></select></label><label>Subtitles <select id="subtitle"><option value="-1">Off</option></select></label><label>Seek <input id="seek" type="range" min="0" max="0" value="0"><span id="seekLabel">0:00</span></label><div class="controls"><button id="play">Play on PSP</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="stop">Stop</button></div><p id="status"></p></aside></div>
<script>
let root=0,path='',selected=null;
const $=s=>document.querySelector(s);
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function option(select,n,label){let o=document.createElement('option');o.value=n;o.textContent=label;select.append(o)}
async function browse(next=''){path=next;let d=await api(`/api/library?root=${root}&path=${encodeURIComponent(path)}`);$('#crumb').textContent='/'+(d.path||'');let box=$('#library');box.innerHTML='';if(d.parent!==null){let b=document.createElement('button');b.textContent='← Parent';b.className='item folder';b.onclick=()=>browse(d.parent);box.append(b)}for(let f of d.folders){let b=document.createElement('button');b.textContent='▸ '+f.name;b.className='item folder';b.onclick=()=>browse(f.path);box.append(b)}for(let v of d.videos){let b=document.createElement('button');b.textContent=(v.kind==='audio'?'♫ ':'▶ ')+v.name;b.className='item';b.onclick=()=>choose(v,b);box.append(b)}}
async function choose(v,button){selected=v;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));button.classList.add('selected');$('#title').textContent=v.name;$('#details').textContent='Loading tracks…';let d=await api('/api/metadata/'+encodeURIComponent(v.id));let a=$('#audio'),s=$('#subtitle');a.innerHTML='';s.innerHTML='<option value="-1">Off</option>';(d.a||[]).forEach(x=>option(a,x.n,`${x.l||'und'} ${x.t||''}`));(d.s||[]).forEach(x=>option(s,x.n,`${x.l||'und'} ${x.t||''}`));$('#seek').max=Math.floor(+d.d||0);$('#seek').value=0;$('#seekLabel').textContent='0:00';$('#details').textContent=v.kind==='audio'?'Music stream':'Ready to send to the PSP'}
async function command(action,extra={}){if(action==='play'&&!selected)return;let body={action,...extra};if(action==='play')Object.assign(body,{id:selected.id,audio:+$('#audio').value||0,subtitle:+$('#subtitle').value||-1,start:+$('#seek').value||0});await api('/api/remote/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#status').textContent='Sent: '+action}
$('#play').onclick=()=>command('play').catch(e=>$('#status').textContent=e.message);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>command(b.dataset.action).catch(e=>$('#status').textContent=e.message));$('#seek').oninput=e=>{$('#seekLabel').textContent=Math.floor(e.target.value/60)+':'+String(e.target.value%60).padStart(2,'0')};$('#seek').onchange=e=>command('seek',{seconds:+e.target.value}).catch(x=>$('#status').textContent=x.message);
api('/api/health').then(x=>{$('#health').textContent=`online · ${x.roots} roots`;browse()}).catch(e=>$('#health').textContent=e.message);
</script>
</html>
