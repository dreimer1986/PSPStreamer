<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSP Streamer</title><link rel="stylesheet" href="/web.css"></head><body>
<header><div class="brand"><img src="/logo.png" alt="PSP Streamer" width="64" height="64"><h1>PSP STREAMER</h1></div><div><label class="inline"><span data-i18n="Language"></span><select class="language"><option value="en">English</option><option value="de">Deutsch</option></select></label><button id="logout" data-i18n="Sign out"></button></div></header>
<nav aria-label="Navigation"><button data-view="library" data-i18n="Library"></button><button data-view="remote" data-i18n="Remote control"></button><button data-view="downloads" data-i18n="Downloads"></button><button data-view="settings" data-i18n="Settings"></button></nav><p id="status" role="status" aria-live="polite"></p>
<section id="view-library" class="view panel"><div class="toolbar"><button id="home" data-i18n="Sources"></button><button id="parent" data-i18n="Parent folder"></button><button id="refresh" data-i18n="Refresh"></button></div><p id="crumb"></p><div class="toolbar" id="batchTools" hidden><button id="selectAll" data-i18n="Select all"></button><button id="selectNone" data-i18n="Clear selection"></button><button id="prepareSelected" data-i18n="Convert selected"></button><button id="prepareFolder" data-i18n="Convert this folder"></button><label class="inline"><input type="checkbox" id="recursive"><span data-i18n="Include subfolders"></span></label></div><p id="selectionCount"></p><div id="library"></div></section>
<section id="view-remote" class="view panel" hidden><h2 id="title" data-i18n="PSP controls"></h2><p id="details"></p><div id="mediaOptions" hidden><div class="fields"><label id="audioField"><span data-i18n="Audio track"></span><select id="audio"></select></label><label id="subtitleField"><span data-i18n="Subtitles"></span><select id="subtitle"></select></label><label><span data-i18n="Audio quality"></span><select id="audio_quality"></select></label><label id="fpsField"><span data-i18n="Frame rate"></span><select id="video_fps"><option value="20">20 fps</option><option value="24000/1001">23.976 fps</option></select></label><label id="profileField"><span data-i18n="Download output"></span><select id="downloadProfile"><option value="normal">LCD 480×272</option><option value="tv">TV 720×480</option><option value="low" data-i18n="LCD low bitrate"></option></select></label></div><label id="seekField"><span data-i18n="Position"></span><input id="seek" type="range" min="0" max="0" value="0"><output id="seekLabel">0:00</output></label><button id="play" disabled data-i18n="Play on PSP"></button><button id="queue" disabled data-i18n="Convert for download"></button><button id="clearMedia" data-i18n="Clear selection"></button></div><div class="controls"><button data-action="pause" data-i18n="Pause"></button><button data-action="resume" data-i18n="Resume"></button><button data-action="stop" data-i18n="Stop"></button></div><p class="muted" data-i18n="Commands expire after 15 seconds if the PSP does not collect them."></p></section>
<section id="view-downloads" class="view" hidden><div class="panel"><h2 data-i18n="Downloads"></h2><p data-i18n="Download the ZIP on your PC and copy its PSP folder to the Memory Stick. Or use Local storage → Server queue on the PSP for Wi-Fi transfers."></p></div><section id="batch" class="panel" hidden><h2 data-i18n="Batch conversion"></h2><p data-i18n="Preview checks the tracks in every file before anything is queued."></p><div class="fields"><label><span data-i18n="Audio language"></span><select id="batchAudio"></select></label><label><span data-i18n="Subtitle language"></span><select id="batchSubtitle"></select></label><label><span data-i18n="Audio quality"></span><select id="batchQuality"></select></label><label><span data-i18n="Frame rate"></span><select id="batchFps"><option value="20">20 fps</option><option value="24000/1001">23.976 fps</option></select></label><label><span data-i18n="Download output"></span><select id="batchProfile"><option value="normal">LCD 480×272</option><option value="tv">TV 720×480</option><option value="low" data-i18n="LCD low bitrate"></option></select></label></div><button id="previewBatch" data-i18n="Check tracks"></button><button id="commitBatch" disabled data-i18n="Queue checked files"></button><button id="cancelBatch" data-i18n="Cancel"></button><p id="batchStatus" role="status"></p><div id="batchRows"></div></section><div id="jobs"></div></section>
<section id="view-settings" class="view" hidden><section class="panel"><h2 data-i18n="Media sources"></h2><form id="sourceForm"><label><input id="sourceFiles" type="checkbox"> <span data-i18n="Files"></span></label><label><input id="sourcePlex" type="checkbox"> Plex</label><label><input id="sourceJellyfin" type="checkbox"> Jellyfin</label><label><input id="sourceRadio" type="checkbox"> Internet Radio</label><button data-i18n="Save sources"></button></form></section>
<section class="panel"><h2>DLNA / UPnP</h2><p data-i18n="Discover media servers on the local network, or add their device description URL. Docker discovery requires host networking; manual addresses also work in bridge mode."></p><label><input id="sourceDlna" type="checkbox"> <span data-i18n="Enable DLNA (save with Save sources)"></span></label><button id="dlnaDiscover" data-i18n="Discover DLNA servers"></button><form id="dlnaForm"><label><span data-i18n="Device description URL"></span><input id="dlnaUrl" type="url" placeholder="http://192.168.1.10:8200/rootDesc.xml" required></label><button data-i18n="Add DLNA server"></button></form><p id="dlnaStatus" role="status"></p><div id="dlnaDevices"></div></section>
<section class="panel"><h2>Jellyfin</h2><p data-i18n="Connect with your Jellyfin server address and user account. Originals are transcoded only by PSPStreamer."></p><form id="jellyfinForm"><label><span data-i18n="Server address"></span><input id="jellyfinUrl" type="url" placeholder="https://jellyfin.example.org" required></label><label><span data-i18n="Username"></span><input id="jellyfinUser" autocomplete="username" required></label><label><span data-i18n="Password"></span><input id="jellyfinPassword" type="password" autocomplete="current-password" required></label><button data-i18n="Connect Jellyfin"></button></form><button id="jellyfinDisconnect" data-i18n="Disconnect Jellyfin"></button><p id="jellyfinStatus" role="status"></p></section>
<section class="panel"><h2>Plex</h2><p data-i18n="Link your account, select a reachable server, then enable Plex above. No shared filesystem is required."></p><button id="plexLink" data-i18n="Link Plex account"></button><a id="plexAuth" hidden target="_blank" rel="noopener noreferrer" data-i18n="Open Plex sign-in"></a><button id="plexServers" data-i18n="Refresh servers"></button><button id="plexDisconnect" data-i18n="Disconnect Plex"></button><label><span data-i18n="Server connection"></span><select id="plexConnection"></select></label><button id="plexSelect" data-i18n="Use connection"></button><p id="plexStatus" role="status"></p><details><summary data-i18n="Optional local path mappings"></summary><p data-i18n="Only needed to prefer existing mounts over Plex HTTP. Save with Save sources."></p><div id="plexMappings"></div><button id="plexAddMapping" data-i18n="Add mapping"></button></details></section>
<section class="panel"><h2>Internet Radio</h2><p data-i18n="Use a direct stream or M3U/PLS playlist, not a website. Pause disconnects; Resume rejoins live."></p><form id="radioForm"><input id="radioId" type="hidden"><label><span data-i18n="Station name"></span><input id="radioName" maxlength="100" required></label><label><span data-i18n="Stream URL"></span><input id="radioUrl" type="url" maxlength="2048" required></label><button data-i18n="Save station"></button><button type="button" id="radioClear" data-i18n="Add new"></button></form><div id="radioStations"></div></section>
<section class="panel"><h2 data-i18n="Password"></h2><p id="passwordInfo"></p><form id="passwordForm" hidden><label><span data-i18n="Current password"></span><input id="oldPassword" type="password" autocomplete="current-password"></label><label><span data-i18n="New password"></span><input id="newPassword" type="password" autocomplete="new-password" required></label><label><span data-i18n="Repeat password"></span><input id="repeatPassword" type="password" autocomplete="new-password" required></label><button data-i18n="Save password"></button></form><p class="muted" data-i18n="Use HTTPS outside your trusted network. After a password change, update the PSP config too."></p></section></section>
<link rel="stylesheet" href="/controller.css"><script src="/i18n.js"></script><script src="/offline.js"></script><script src="/app.js"></script><script src="/controller.js"></script></body></html>
