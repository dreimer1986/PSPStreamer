; FuSa Fullscreen: automatic zoom in progressive/interlaced TV mode.
; Composite/S-video use interlace. Component follows Sony's active TV mode.
auto_zoom=0
auto_zoom_delay_seconds=5
; 0 follows active Sony mode, 1 forces interlaced (component CRT), 2 progressive.
; Composite/S-video always use interlaced, regardless of this preference.
tv_scan=0
; Keep zoom across HOME/SCREEN and retry after recoverable interruptions.
; NOTE+R still explicitly disables zoom. 0 restores previous behaviour.
keep_fullscreen=1
; Experimental ARK VBlank/capture coordination, not a literal legacy port.
; May affect timing. 1 guards only an in-flight copy after the normal wait.
; Never waits for the next output slot; guard deadline is 4 ms. 0 disables it.
experimental_speedboost=0
